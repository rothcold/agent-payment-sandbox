name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (default features = sqlite)
        run: cargo build --release --locked

      - name: Build (postgres feature)
        run: cargo build --no-default-features --features postgres --locked

      - name: Build (both features)
        run: cargo build --features "sqlite postgres" --locked

      - name: Test
        run: cargo test --features "sqlite postgres" --locked
